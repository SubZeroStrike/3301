<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3301</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .logo {
      width: 300px;
      height: auto;
    }

    .countdown {
      display: flex;
      gap: 24px;
      color: #000000;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .time-value {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .time-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #333333;
    }

    .coordinates {
      font-size: 24px;
      color: #000000;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    .coordinates.visible {
      opacity: 1;
    }

    .separator {
      font-size: 48px;
      font-weight: bold;
      color: #000000;
    }

    @media (max-width: 600px) {
      .logo {
        width: 200px;
      }

      .time-value {
        font-size: 28px;
      }

      .countdown {
        gap: 12px;
      }

      .separator {
        font-size: 28px;
      }

      .coordinates {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img 
      src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-LxNYUVOQOpt9FkU446zB3SjEvSU06n.jpg" 
      alt="Cicada 3301" 
      class="logo"
    >
    
    <div class="countdown" id="countdown">
      <div class="time-block">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </div>

    <div class="coordinates" id="coordinates">37.759720, -121.543372</div>
  </div>

  <script>
    const targetDate = new Date('2026-05-30T13:40:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('coordinates').classList.add('visible');
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
